services:
  - type: web
    name: techinventory-api
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techinventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://techinventory.vercel.app
      - key: PORT
        value: 3001

databases:
  - name: techinventory-db
    databaseName: techinventory
    user: techinventory
