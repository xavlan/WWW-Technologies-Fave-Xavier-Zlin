# Render Blueprint — FREE web service only (no paid database).
# Create PostgreSQL on Neon (free) and set DATABASE_URL manually in Render dashboard.
services:
  - type: web
    name: techinventory-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run build:render
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: 3001
