services:
  postgres:
    image: postgres:15
    container_name: techinventory-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techinventory
    volumes:
      - techinventory_pgdata:/var/lib/postgresql/data

volumes:
  techinventory_pgdata:
