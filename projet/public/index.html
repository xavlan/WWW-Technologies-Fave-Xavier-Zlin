<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechInventory — Catalogue public</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="sticky top-0 z-10 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4">
        <a href="/" class="text-xl font-semibold tracking-tight text-white">TechInventory</a>
        <nav class="flex items-center gap-4 text-sm">
          <span class="text-slate-500">Catalogue</span>
          <a href="/admin.html" class="text-sky-400 hover:underline">Administration</a>
        </nav>
      </div>
    </header>

    <section class="border-b border-slate-800 bg-slate-900/40">
      <div class="mx-auto max-w-6xl px-4 py-8">
        <h1 class="text-2xl font-bold md:text-3xl">Composants PC</h1>
        <p class="mt-2 max-w-2xl text-slate-400">
          Parcourez le stock en temps réel. La recherche interroge le serveur ; les filtres catégorie et prix utilisent les mêmes paramètres que <code class="rounded bg-slate-800 px-1 text-xs">GET /api/components</code>.
        </p>

        <form id="catalog-filters" class="mt-8 grid gap-4 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6" onsubmit="return false;">
          <label class="block lg:col-span-2">
            <span class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Recherche</span>
            <input
              id="filter-search"
              type="search"
              autocomplete="off"
              placeholder="Nom, marque, SKU…"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm outline-none ring-sky-500/50 focus:border-sky-500 focus:ring-2"
            />
          </label>
          <label class="block">
            <span class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Catégorie</span>
            <select
              id="filter-category"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/50"
            >
              <option value="">Chargement…</option>
            </select>
          </label>
          <label class="block">
            <span class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Prix min (€)</span>
            <input
              id="filter-min"
              type="number"
              min="0"
              step="0.01"
              placeholder="0"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/50"
            />
          </label>
          <label class="block">
            <span class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Prix max (€)</span>
            <input
              id="filter-max"
              type="number"
              min="0"
              step="0.01"
              placeholder="∞"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/50"
            />
          </label>
          <label class="block">
            <span class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Tri (page courante)</span>
            <select
              id="filter-sort"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/50"
            >
              <option value="name">Nom (A–Z)</option>
              <option value="priceAsc">Prix croissant</option>
              <option value="priceDesc">Prix décroissant</option>
            </select>
          </label>
          <div class="flex items-end gap-2 md:col-span-2 lg:col-span-2">
            <button
              type="button"
              id="filter-apply"
              class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-500"
            >
              Actualiser
            </button>
          </div>
        </form>

        <p id="catalog-meta" class="mt-4 text-sm text-slate-500"></p>
        <div id="catalog-error" class="mt-2 hidden rounded-lg border border-red-800 bg-red-950/50 px-3 py-2 text-sm text-red-200"></div>
      </div>
    </section>

    <main class="mx-auto max-w-6xl px-4 py-10">
      <div id="catalog-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
      <div id="catalog-pagination" class="mt-10 flex justify-center"></div>
    </main>

    <footer class="border-t border-slate-800 py-8 text-center text-sm text-slate-600">
      TechInventory · API REST + PostgreSQL
    </footer>

    <script src="/js/config.js"></script>
    <script src="/js/catalog.js"></script>
  </body>
</html>
