name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint backend
        run: |
          cd backend
          npm run lint

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Type check backend
        run: |
          cd backend
          npm run typecheck

      - name: Type check frontend
        run: |
          cd frontend
          npm run typecheck

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techinventory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Setup test database
        run: |
          cd backend
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/techinventory_test" > .env.test
          echo "JWT_SECRET=test-secret-key-for-testing-min-32-chars" >> .env.test
          echo "JWT_EXPIRES_IN=1h" >> .env.test
          echo "PORT=3001" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "CORS_ORIGIN=http://localhost:3000" >> .env.test

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Run Prisma migrations
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test

      - name: Run Jest tests with coverage
        run: |
          cd backend
          npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js
        run: |
          cd frontend
          npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techinventory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Cypress dependencies
        run: |
          npm ci
          cd frontend
          npx cypress install

      - name: Setup test database
        run: |
          cd backend
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/techinventory_test" > .env.test
          echo "JWT_SECRET=test-secret-key-for-testing-min-32-chars" >> .env.test
          echo "JWT_EXPIRES_IN=1h" >> .env.test
          echo "PORT=3001" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "CORS_ORIGIN=http://localhost:3000" >> .env.test

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Run Prisma migrations
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test

      - name: Seed test database
        run: |
          cd backend
          npm run db:seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test

      - name: Start backend server
        run: |
          cd backend
          npm run build
          npm start &
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test
          JWT_SECRET: test-secret-key-for-testing-min-32-chars
          JWT_EXPIRES_IN: 1h
          PORT: 3001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000

      - name: Start frontend dev server
        run: |
          cd frontend
          npm run dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_APP_NAME: TechInventory

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:3001
          npx wait-on http://localhost:3000

      - name: Run Cypress tests
        run: |
          npx cypress run
        env:
          CYPRESS_baseUrl: http://localhost:3000
          CYPRESS_apiUrl: http://localhost:3001/api/v1

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
