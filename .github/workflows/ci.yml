name: CI

on:
  push:
    branches: ['**']
    paths:
      - 'projet/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'projet/**'
      - '.github/workflows/**'

defaults:
  run:
    working-directory: projet

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci
        working-directory: projet/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: projet/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projet/frontend

      - name: Lint backend
        run: npm run lint
        working-directory: projet/backend

      - name: Lint frontend
        run: npm run lint
        working-directory: projet/frontend

      - name: Type check backend
        run: npm run typecheck
        working-directory: projet/backend

      - name: Type check frontend
        run: npm run typecheck
        working-directory: projet/frontend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techinventory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci
        working-directory: projet/backend

      - name: Setup test database
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/techinventory_test" > .env.test
          echo "JWT_SECRET=test-secret-key-for-testing-min-32-chars" >> .env.test
          echo "JWT_EXPIRES_IN=1h" >> .env.test
          echo "PORT=3001" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "CORS_ORIGIN=http://localhost:3000" >> .env.test
        working-directory: projet/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: projet/backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: projet/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test

      - name: Run Jest tests with coverage
        run: npm run test:coverage
        working-directory: projet/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test
          JWT_SECRET: test-secret-key-for-testing-min-32-chars
          JWT_EXPIRES_IN: 1h
          CORS_ORIGIN: http://localhost:3000
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: projet/backend/coverage

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projet/frontend

      - name: Build Next.js
        run: npm run build
        working-directory: projet/frontend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: techinventory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci
        working-directory: projet/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projet/frontend

      - name: Install Cypress dependencies
        run: |
          npm ci
          npx cypress install
        working-directory: projet

      - name: Setup test database
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/techinventory_test" > .env.test
          echo "JWT_SECRET=test-secret-key-for-testing-min-32-chars" >> .env.test
          echo "JWT_EXPIRES_IN=1h" >> .env.test
          echo "PORT=3001" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "CORS_ORIGIN=http://localhost:3000" >> .env.test
        working-directory: projet/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: projet/backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: projet/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test

      - name: Seed test database
        run: npm run db:seed
        working-directory: projet/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test

      - name: Start backend server
        run: |
          npm run build
          npm start &
        working-directory: projet/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/techinventory_test
          JWT_SECRET: test-secret-key-for-testing-min-32-chars
          JWT_EXPIRES_IN: 1h
          PORT: 3001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000

      - name: Start frontend dev server
        run: npm run dev &
        working-directory: projet/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_APP_NAME: TechInventory

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:3001
          npx wait-on http://localhost:3000
        working-directory: projet

      - name: Run Cypress tests
        run: npx cypress run
        working-directory: projet
        env:
          CYPRESS_baseUrl: http://localhost:3000
          CYPRESS_apiUrl: http://localhost:3001/api/v1

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: projet/cypress/screenshots

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: projet/cypress/videos
